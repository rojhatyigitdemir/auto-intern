name: Staj Botu Calistirici

on:
  push:
    branches: [ main ] 
  schedule:
    - cron: '0 8 * * *' 
  workflow_dispatch: # İŞTE BU SATIR SANA O BUTONU VERECEK

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v3

    - name: Python Kur
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Kutuphaneleri Kur
      run: |
        python -m pip install --upgrade pip
        pip install playwright google-generativeai
        playwright install

    - name: Botu Atesle
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python scraper.py
